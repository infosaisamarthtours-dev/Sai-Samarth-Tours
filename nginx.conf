# Sai Samarth Tours - Production Nginx Configuration
# Optimized for SEO, 301 Redirects, Asset Caching, and Fast SPA Performance

server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name saisamarthtours.com www.saisamarthtours.com localhost _;

    # 1. 301 Redirect www to non-www canonical domain (Solves duplicate content SEO error)
    if ($host ~* ^www\.(.+)$) {
        return 301 https://saisamarthtours.com$request_uri;
    }

    # 2. 301 Redirect HTTP to HTTPS behind reverse proxy / load balancer (Railway, Cloudflare, etc.)
    if ($http_x_forwarded_proto = "http") {
        return 301 https://saisamarthtours.com$request_uri;
    }

    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression for Higher PageSpeed / Core Web Vitals SEO Scores
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Security & Crawler Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Long-term Caching for Immutable Static Assets
    location ~* \.(js|css|webp|png|jpg|jpeg|gif|ico|svg|woff2|woff|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Revalidation for HTML and Sitemap
    location ~* \.(html|xml|txt)$ {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri $uri/ $uri/index.html /index.html;
    }

    # SPA Routing with Static Pre-rendered Sub-path Fallback
    location / {
        try_files $uri $uri/ $uri/index.html /index.html;
    }
}
