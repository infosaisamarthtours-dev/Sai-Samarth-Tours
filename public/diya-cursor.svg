<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <defs>
    <filter id="flame-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#EA580C"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="90%" stop-color="#FEF08A"/>
    </linearGradient>
    <linearGradient id="diyaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>
  </defs>

  <!-- Flame Glow Aura -->
  <ellipse cx="16" cy="10" rx="6" ry="8" fill="#F59E0B" opacity="0.4" filter="url(#flame-glow)"/>

  <!-- Flame Body -->
  <path d="M16 3 C18 7, 20 10, 19 13 C18 16, 14 16, 13 13 C12 10, 14 7, 16 3 Z" fill="url(#flameGrad)" filter="url(#flame-glow)"/>
  
  <!-- Inner White Flame Core -->
  <ellipse cx="16" cy="12" rx="1.8" ry="3.5" fill="#FFFFFF"/>

  <!-- Diya Lamp Bowl -->
  <path d="M6 17 C6 24, 26 24, 26 17 C23 19, 9 19, 6 17 Z" fill="url(#diyaGrad)" stroke="#451A03" stroke-width="0.8"/>
  
  <!-- Rim Highlight -->
  <ellipse cx="16" cy="17" rx="10" ry="2.2" fill="#F59E0B" opacity="0.8"/>
  <ellipse cx="16" cy="17" rx="8.5" ry="1.5" fill="#78350F"/>
</svg>
